<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QA Agent Farm — LLM Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
:root {
  --font-sans: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --text-accent: #2563eb;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --surface-1: #f8fafc;
  --surface-2: #ffffff;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
  --radius-lg: 16px;
  --pass: #059669;
  --warn: #d97706;
  --bg: #eef2ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99, 102, 241, 0.12), transparent),
    radial-gradient(ellipse 50% 40% at 100% 0%, rgba(14, 165, 233, 0.06), transparent);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}
.layout { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
.app-header { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem; }
.app-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 .25rem; }
.app-subtitle { font-size: .875rem; color: var(--text-secondary); margin: 0; max-width: 46ch; }
.eyebrow { color: var(--text-accent); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin: 0 0 .25rem; }
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text-primary); padding: .5rem .9rem; border-radius: 8px; cursor: pointer; font-size: .85rem; font-family: var(--font-sans); font-weight: 500; transition: all .15s; text-decoration: none; }
.btn:hover { border-color: var(--text-accent); color: var(--text-accent); }
.btn-primary { background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff; border: none; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3); }
.btn-primary:hover { color: #fff; transform: translateY(-1px); }
.panel-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); margin-bottom: 1rem; overflow: hidden; }
.panel-head { padding: .9rem 1.1rem; border-bottom: 1px solid var(--border); font-size: .8rem; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel-body { padding: 1rem 1.1rem; }
.field-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
.field { margin-bottom: .85rem; }
.field:last-child { margin-bottom: 0; }
.hint { font-size: .72rem; color: var(--text-muted); margin: .3rem 0 0; line-height: 1.45; }
.input, select.input { width: 100%; font-family: var(--font-sans); font-size: 13px; background: var(--surface-1); border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; color: var(--text-primary); }
.input:focus { outline: none; border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.input:disabled { background: #f1f5f9; color: var(--text-muted); }
.badge { font-size: 10.5px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--border); color: var(--text-muted); font-weight: 600; }
.badge.on { color: var(--pass); border-color: #6ee7b7; background: #ecfdf5; }
.badge.active { color: #4f46e5; border-color: #c4b5fd; background: #f5f3ff; }
.provider-select { display: flex; align-items: center; gap: .5rem; cursor: pointer; }
.provider-select input { accent-color: #4f46e5; width: 16px; height: 16px; }
.status-line { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--text-secondary); margin-top: .5rem; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); flex-shrink: 0; }
.status-dot.ok { background: var(--pass); }
.status-dot.err { background: #dc2626; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; }
@media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }
.save-bar { display: flex; align-items: center; gap: .75rem; justify-content: flex-end; margin-top: 1.25rem; }
.save-status { font-size: .8rem; color: var(--text-secondary); }
.save-status.ok { color: var(--pass); }
.save-status.err { color: #dc2626; }
</style>
</head>
<body>
<div class="layout">
  <header class="app-header">
    <div>
      <p class="eyebrow">QA Agent Farm</p>
      <h1 class="app-title">LLM Settings</h1>
      <p class="app-subtitle">Choose which model Agent 1 (Requirement Analyst) calls and provide its credentials. Keys are stored locally in <code>.data/llm-settings.json</code> (gitignored) and never sent back to the browser in full.</p>
    </div>
    <a href="simulator.html" class="btn"><i class="ti ti-arrow-left"></i> Back to simulator</a>
  </header>

  <div id="providers"></div>

  <div class="panel-card" id="health-card">
    <div class="panel-head"><i class="ti ti-activity"></i> Active runner health</div>
    <div class="panel-body">
      <div class="status-line"><span class="status-dot" id="health-dot"></span><span id="health-text">Checking…</span></div>
    </div>
  </div>

  <div class="save-bar">
    <span class="save-status" id="save-status"></span>
    <button class="btn btn-primary" id="btn-save"><i class="ti ti-device-floppy"></i> Save settings</button>
  </div>
</div>
<script type="module" src="js/settings-app.js"></script>
</body>
</html>
